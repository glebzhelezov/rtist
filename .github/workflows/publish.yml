# Publish the package to PyPI or TestPyPI.
#
# Manual-only for now: nothing runs until someone triggers this workflow from
# the Actions tab and picks a target index.
#
# Uploads use PyPI Trusted Publishing (OIDC), so no API token is stored in the
# repo. Before the first run, register a trusted publisher on each index:
#   PyPI project -> Settings -> Publishing -> Add a new publisher
#     Owner: glebzhelezov   Repository: rtist
#     Workflow: publish.yml Environment: pypi      (TestPyPI: testpypi)
# and create matching `pypi` / `testpypi` environments under the GitHub repo's
# Settings -> Environments.
#
# The sdist is built here; the wheels (Linux and macOS, x86_64 and arm64) come
# from wheels.yml, called below. Every `dist-*` artifact gets uploaded, but
# only after ci.yml (lint and tests) and every wheel build have passed.

name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to upload to"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*

  ci:
    uses: ./.github/workflows/ci.yml

  wheels:
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Upload to ${{ inputs.target }}
    # Nothing is uploaded unless lint, every test job and every wheel passed.
    needs: [ci, build-sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Upload to TestPyPI
        if: inputs.target == 'testpypi'
        run: >
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          dist/*

      - name: Upload to PyPI
        if: inputs.target == 'pypi'
        run: uv publish --trusted-publishing always dist/*
