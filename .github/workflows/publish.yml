# Publish the package to PyPI or TestPyPI.
#
# Manual-only for now: nothing runs until someone triggers this workflow from
# the Actions tab and picks a target index.
#
# Uploads use PyPI Trusted Publishing (OIDC), so no API token is stored in the
# repo. Before the first run, register a trusted publisher on each index:
#   PyPI project -> Settings -> Publishing -> Add a new publisher
#     Owner: glebzhelezov   Repository: rtist
#     Workflow: publish.yml Environment: pypi      (TestPyPI: testpypi)
# and create matching `pypi` / `testpypi` environments under the GitHub repo's
# Settings -> Environments.
#
# The build job currently produces only the sdist. Wheels for Linux and macOS
# (x86_64 + arm64) will be built by cibuildwheel in the CI workflow, which
# uploads them as `dist-*` artifacts. The publish job already collects every
# `dist-*` artifact, so wheels will be picked up once those jobs exist.

name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to upload to"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*

  publish:
    name: Upload to ${{ inputs.target }}
    needs: [build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@v6

      - name: Upload to TestPyPI
        if: inputs.target == 'testpypi'
        run: >
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          dist/*

      - name: Upload to PyPI
        if: inputs.target == 'pypi'
        run: uv publish --trusted-publishing always dist/*
