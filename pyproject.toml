[build-system]
requires = [
    "scikit-build-core>=0.11",
    "cython>=3.0",
    "cython-cmake>=0.3",
    "cysignals",
]
build-backend = "scikit_build_core.build"

[project]
name = "mtrip"
version = "0.4.0.dev0"
description = "Find exact median triplet trees (phylogenetics)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gleb Zhelezov", email = "gleb@glebzh.com" }]
dependencies = ["cysignals"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/glebzhelezov/rtist"
Issues = "https://github.com/glebzhelezov/rtist/issues"

[project.scripts]
mtrip = "mtrip.cli.find:main"
mtrip-suboptimal = "mtrip.cli.suboptimal:main"
mtrip-combine = "mtrip.cli.combine:main"

[dependency-groups]
dev = [
    # Formatters are pinned exactly: different versions format differently.
    "ruff==0.11.11",
    "clang-format==23.1.3",
    "pytest>=8",
]

[tool.uv]
# uv rebuilds the editable install when any of these change, so `uv run`
# always uses up-to-date compiled modules. Edits to .py files apply directly.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "lib/**/*.c" },
    { file = "lib/**/*.h" },
    { file = "lib/CMakeLists.txt" },
    { file = "src/mtrip/*.pyx" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/mtrip"]
# Keep CMake build trees between builds so rebuilds are incremental.
build-dir = "build/{wheel_tag}"
sdist.exclude = [".github/"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
