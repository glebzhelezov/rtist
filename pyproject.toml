[build-system]
requires = [
    "scikit-build-core>=0.11",
    "cython>=3.0",
    "cython-cmake>=0.3",
    "cysignals",
]
build-backend = "scikit_build_core.build"

[project]
name = "mtrip"
version = "0.4.0.dev0"
description = "Find exact median triplet trees (phylogenetics)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gleb Zhelezov", email = "gleb@glebzh.com" }]
dependencies = ["cysignals"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/glebzhelezov/rtist"
Issues = "https://github.com/glebzhelezov/rtist/issues"

[project.scripts]
mtrip = "mtrip.cli.find:main"
mtrip-suboptimal = "mtrip.cli.suboptimal:main"
mtrip-combine = "mtrip.cli.combine:main"

[dependency-groups]
dev = [
    # Formatters are pinned exactly: different versions format differently.
    "ruff==0.11.11",
    "clang-format==23.1.3",
    "pytest>=8",
]

[tool.uv]
# uv rebuilds the editable install when any of these change, so `uv run`
# always uses up-to-date compiled modules. Edits to .py files apply directly.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "lib/**/*.c" },
    { file = "lib/**/*.h" },
    { file = "lib/CMakeLists.txt" },
    { file = "src/mtrip/*.pyx" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/mtrip"]
# Keep CMake build trees between builds so rebuilds are incremental.
build-dir = "build/{wheel_tag}"
sdist.exclude = [".github/"]

[tool.cibuildwheel]
# CPython only, glibc Linux and macOS. Free-threaded (3.14t) and musl builds
# are left out for now.
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*t-* *-musllinux_*"
build-frontend = "build[uv]"
test-requires = "pytest"
test-sources = ["tests", "examples"]
test-command = "pytest -ra tests"
# The wheels bundle OpenMP (libgomp on Linux, libomp on macOS); fail the
# build if one ever comes out single-threaded.
test-environment = { MTRIP_EXPECT_OPENMP = "1" }

[tool.cibuildwheel.macos]
# Apple clang has no OpenMP. CI installs conda-forge's llvm-openmp, which
# supports old macOS releases (Homebrew's only supports the runner's own),
# and exports its prefix as MTRIP_OPENMP_PREFIX. delocate copies libomp
# into the wheel; DYLD_LIBRARY_PATH lets it resolve libomp's @rpath name.
# If the bundled libomp needs a newer macOS than the wheel targets, delocate
# raises the wheel's platform tag to match, so check the wheel names.
environment = { OpenMP_ROOT = "$MTRIP_OPENMP_PREFIX" }
repair-wheel-command = "DYLD_LIBRARY_PATH=$MTRIP_OPENMP_PREFIX/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[[tool.cibuildwheel.overrides]]
# Intel Macs: support macOS 10.15+. (arm64 wheels start at macOS 11 anyway.)
select = "*-macosx_x86_64"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
